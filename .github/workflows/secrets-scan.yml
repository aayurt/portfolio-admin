# Secret leak gate. Runs on every push/PR and fails the run if any
# committed change introduces something looking like a password, API key,
# or token. Uses the repo's .gitleaks.toml (default rules + embedded-DB-
# credential rule); known historical hits are baselined in .gitleaksignore.
# Complements (does not replace) GitHub push protection — enable that at
# Settings → Code security → Secret scanning → Push protection.

name: Secrets scan

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history for baseline diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        run: |
          set -euo pipefail
          curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz \
            | tar xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --config .gitleaks.toml -v
